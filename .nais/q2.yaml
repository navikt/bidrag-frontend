name: bidrag-frontend-q2

ingresses:
  - https://bidrag.intern.dev.nav.no
  - https://bidrag-q2.intern.dev.nav.no
replicas: 2

env:
  - name: BIDRAG_ADMIN_URL
    value: http://bidrag-admin
  - name: BIDRAG_ADMIN_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-admin/.default

  - name: BIDRAG_SAK_URL
    value: https://bidrag-sak-q2.dev-fss-pub.nais.io
  - name: BIDRAG_SAK_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-sak-q2/.default

  - name: BIDRAG_ORGANISASJON_URL
    value: https://bidrag-organisasjon.dev-fss-pub.nais.io/bidrag-organisasjon
  - name: BIDRAG_ORGANISASJON_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-organisasjon/.default

  - name: BIDRAG_PERSON_URL
    value: https://bidrag-person-q2.dev-fss-pub.nais.io/bidrag-person
  - name: BIDRAG_PERSON_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-person-q2/.default

  - name: BIDRAG_TILGANGSKONTROLL_URL
    value: http://bidrag-tilgangskontroll
  - name: BIDRAG_TILGANGSKONTROLL_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-tilgangskontroll/.default

  - name: BIDRAG_SAMHANDLER_URL
    value: http://bidrag-samhandler-q2
  - name: BIDRAG_SAMHANDLER_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-samhandler-q2/.default

  - name: BIDRAG_BELOPSHISTORIKK_URL
    value: http://bidrag-belopshistorikk-q2
  - name: BIDRAG_BELOPSHISTORIKK_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-belopshistorikk-q2/.default

  - name: BIDRAG_VEDTAK_URL
    value: http://bidrag-vedtak-q2
  - name: BIDRAG_VEDTAK_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-vedtak-q2/.default

  - name: BIDRAG_RESKONTRO_URL
    value: http://bidrag-reskontro-q2
  - name: BIDRAG_RESKONTRO_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-reskontro-q2/.default

  - name: BIDRAG_DOKUMENT_URL
    value: https://bidrag-dokument.dev-fss-pub.nais.io/bidrag-dokument
  - name: BIDRAG_DOKUMENT_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-dokument/.default

  - name: BIDRAG_BEHANDLING_URL
    value: http://bidrag-behandling-q2
  - name: BIDRAG_BEHANDLING_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-behandling-q2/.default

  - name: BIDRAG_DOKUMENT_PRODUKSJON_URL
    value: http://bidrag-dokument-produksjon
  - name: BIDRAG_DOKUMENT_PRODUKSJON_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-dokument-produksjon/.default

  - name: BISYS_URL
    value: https://wasapp-q2.adeo.no/rtv-bidrag/
  - name: MODIA_URL
    value: https://modiapersonoversikt.intern.dev.nav.no

  - name: PERSONSOK_URL
    value: https://pdl-web.intern.dev.nav.no/sokperson

  - name: BIDRAG_UI_BASE_URL
    value: https://bidrag-ui.dev.adeo.no

  - name: BIDRAG_DOKUMENT_FORSENDELSE_URL
    value: http://bidrag-dokument-forsendelse
  - name: BIDRAG_DOKUMENT_FORSENDELSE_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-dokument-forsendelse/.default
    
  - name: KODEVERK_URL
    value: https://bidrag-kodeverk.intern.dev.nav.no
  - name: KODEVERK_URL_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-kodeverk/.default

  - name: BIDRAG_DOKUMENT_ARKIV_URL
    value: https://bidrag-dokument-arkiv.dev-fss-pub.nais.io/bidrag-dokument-arkiv
  - name: BIDRAG_DOKUMENT_ARKIV_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-dokument-arkiv/.default

unleash:
  host: bidrag-unleash-api.nav.cloud.nais.io
  environment: development

outbound:
  rules:
    - application: bidrag-tilgangskontroll
    - application: bidrag-samhandler-q2
    - application: bidrag-belopshistorikk-q2
    - application: bidrag-vedtak-q2
    - application: bidrag-reskontro-q2
    - application: bidrag-dokument-forsendelse
    - application: bidrag-admin
    - application: bidrag-behandling-q2
    - application: bidrag-kodeverk
    - application: bidrag-dokument-produksjon
  external:
    - bidrag-sak-q2.dev-fss-pub.nais.io
    - bidrag-organisasjon.dev-fss-pub.nais.io
    - bidrag-person-q2.dev-fss-pub.nais.io
    - bidrag-dokument.dev-fss-pub.nais.io
    - bidrag-dokument-arkiv.dev-fss-pub.nais.io
