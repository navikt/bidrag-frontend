name: bidrag-frontend-q1

ingresses:
  - https://bidrag-q1.intern.dev.nav.no
replicas: 1

env:
  - name: BIDRAG_ADMIN_URL
    value: http://bidrag-admin
  - name: BIDRAG_ADMIN_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-admin/.default

  - name: BIDRAG_SAK_URL
    value: https://bidrag-sak-q1.dev-fss-pub.nais.io
  - name: BIDRAG_SAK_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-sak-q1/.default

  - name: BIDRAG_ORGANISASJON_URL
    value: https://bidrag-organisasjon-feature.dev-fss-pub.nais.io/bidrag-organisasjon
  - name: BIDRAG_ORGANISASJON_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-organisasjon-feature/.default

  - name: BIDRAG_PERSON_URL
    value: https://bidrag-person-q1.dev-fss-pub.nais.io/bidrag-person
  - name: BIDRAG_PERSON_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-person-q1/.default

  - name: BIDRAG_TILGANGSKONTROLL_URL
    value: http://bidrag-tilgangskontroll-feature
  - name: BIDRAG_TILGANGSKONTROLL_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-tilgangskontroll-feature/.default

  - name: BIDRAG_SAMHANDLER_URL
    value: http://bidrag-samhandler-q1
  - name: BIDRAG_SAMHANDLER_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-samhandler-q1/.default

  - name: BIDRAG_BELOPSHISTORIKK_URL
    value: http://bidrag-belopshistorikk-q1
  - name: BIDRAG_BELOPSHISTORIKK_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-belopshistorikk-q1/.default

  - name: BIDRAG_VEDTAK_URL
    value: http://bidrag-vedtak-q1
  - name: BIDRAG_VEDTAK_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-vedtak-q1/.default

  - name: BIDRAG_RESKONTRO_URL
    value: http://bidrag-reskontro-q1
  - name: BIDRAG_RESKONTRO_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-reskontro-q1/.default

  - name: BIDRAG_DOKUMENT_URL
    value: https://bidrag-dokument-feature.dev-fss-pub.nais.io/bidrag-dokument
  - name: BIDRAG_DOKUMENT_AUDIENCE
    value: api://dev-fss.bidrag.bidrag-dokument-feature/.default

  - name: BIDRAG_BEHANDLING_URL
    value: http://bidrag-behandling-q1
  - name: BIDRAG_BEHANDLING_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-behandling-q1/.default

  - name: BIDRAG_DOKUMENT_PRODUKSJON_URL
    value: http://bidrag-dokument-produksjon
  - name: BIDRAG_DOKUMENT_PRODUKSJON_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-dokument-produksjon/.default

  - name: BISYS_URL
    value: https://wasapp-q1.adeo.no/rtv-bidrag/
  - name: MODIA_URL
    value: https://modiapersonoversikt.intern.dev.nav.no

  - name: PERSONSOK_URL
    value: https://pdl-web.intern.dev.nav.no/sokperson

  - name: BIDRAG_UI_BASE_URL
    value: https://bidrag-ui-feature.dev.adeo.no


  - name: BIDRAG_DOKUMENT_FORSENDELSE_URL
    value: http://bidrag-dokument-forsendelse-feature
  - name: BIDRAG_DOKUMENT_FORSENDELSE_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-dokument-forsendelse-feature/.default

  - name: KODEVERK_URL
    value: http://bidrag-kodeverk
  - name: KODEVERK_URL_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-kodeverk/.default

  - name: BIDRAG_DOKUMENT_ARKIV_URL
    value: https://bidrag-dokument-arkiv-feature.dev-fss-pub.nais.io/bidrag-dokument-arkiv
  - name: BIDRAG_DOKUMENT_ARKIV_AUDIENCE
    value: api://dev-gcp.bidrag.bidrag-dokument-arkiv-feature/.default

  - name: FOERSTESIDEGENERATOR_URL
    value: https://foerstesidegenerator-q1.dev-fss-pub.nais.io
  - name: FOERSTESIDEGENERATOR_AUDIENCE
    value: api://dev-fss.teamdokumenthandtering.foerstesidegenerator-q1/.default

unleash:
  host: bidrag-unleash-api.nav.cloud.nais.io
  environment: development

outbound:
  rules:
    - application: bidrag-tilgangskontroll-feature
    - application: bidrag-samhandler-q1
    - application: bidrag-belopshistorikk-q1
    - application: bidrag-vedtak-q1
    - application: bidrag-reskontro-q1
    - application: bidrag-dokument-forsendelse-feature
    - application: bidrag-admin
    - application: bidrag-behandling-q1
    - application: bidrag-kodeverk
    - application: bidrag-dokument-produksjon
  external:
    - bidrag-sak-q1.dev-fss-pub.nais.io
    - bidrag-organisasjon-feature.dev-fss-pub.nais.io
    - bidrag-person-q1.dev-fss-pub.nais.io
    - bidrag-dokument-feature.dev-fss-pub.nais.io
    - bidrag-dokument-arkiv-feature.dev-fss-pub.nais.io
    - foerstesidegenerator-q1.dev-fss-pub.nais.io
