name: "Deploy localauth"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".nais/localauth.yaml"
      - ".github/workflows/deploy-localauth.yml"

jobs:
  deploy:
    name: "Deploy localauth til dev-gcp"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy til dev-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/localauth.yaml
