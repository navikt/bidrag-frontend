name: "Deploy localauth"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".nais/localauth.yaml"
      - ".github/workflows/deploy-localauth.yml"

jobs:
  deploy:
    name: "Deploy localauth til dev-gcp"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy til dev-gcp
        uses: nais/deploy/actions/deploy@7b60caaded00332e9aa117a8342daa0876851dfe # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/localauth.yaml
