version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
    replaces-base: false
updates:

  - package-ecosystem: "npm"
    registries: "*"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      aksel:
        patterns:
          - '@navikt/ds*'
          - '@navikt/aksel*'

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: 'daily'

  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
